name: Release Artifact

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux release artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain stable
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537
        with:
          toolchain: stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Install cargo-cyclonedx
        run: cargo install --locked --version 0.5.9 cargo-cyclonedx

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/oci-email-delivery-mcp dist/oci-email-delivery-mcp-linux-x86_64
          (
            cd dist
            tar -czf oci-email-delivery-mcp-linux-x86_64.tar.gz \
              oci-email-delivery-mcp-linux-x86_64
            sha256sum oci-email-delivery-mcp-linux-x86_64.tar.gz \
              > oci-email-delivery-mcp-linux-x86_64.tar.gz.sha256
          )

      - name: Generate Linux dependency SBOM
        shell: bash
        run: |
          set -euo pipefail

          cargo cyclonedx \
            --format json \
            --spec-version 1.5 \
            --describe binaries \
            --no-build-deps \
            --target x86_64-unknown-linux-gnu
          mv \
            oci-email-delivery-mcp_bin.cdx.json \
            dist/oci-email-delivery-mcp-linux-x86_64.cdx.json

      - name: Verify release artifact set
        shell: bash
        run: |
          set -euo pipefail

          (
            cd dist
            sha256sum --check oci-email-delivery-mcp-linux-x86_64.tar.gz.sha256
          )
          printf '%s\n' \
            oci-email-delivery-mcp-linux-x86_64 \
            | sort > expected-archive-files.txt
          tar -tzf dist/oci-email-delivery-mcp-linux-x86_64.tar.gz \
            | sort > actual-archive-files.txt
          diff -u expected-archive-files.txt actual-archive-files.txt

          sbom_path=dist/oci-email-delivery-mcp-linux-x86_64.cdx.json
          jq -e '
            .bomFormat == "CycloneDX"
            and .specVersion == "1.5"
            and (.components | type == "array" and length > 0)
            and (.dependencies | type == "array" and length > 0)
            and (
              .metadata.component["bom-ref"] as $root
              | ($root | type == "string" and length > 0)
              and any(
                .dependencies[];
                .ref == $root
                and (.dependsOn | type == "array" and length > 0)
              )
            )
          ' "$sbom_path" >/dev/null
          jq -r '
            .metadata.component["bom-ref"] as $root
            | "SBOM components=\(.components | length) "
              + "dependencies=\(.dependencies | length) "
              + "root_dependencies=\(
                  [.dependencies[] | select(.ref == $root) | .dependsOn[]]
                  | length
                )"
          ' "$sbom_path"

      - name: Upload release artifact
        # actions/upload-artifact v4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: oci-email-delivery-mcp-linux-x86_64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/oci-email-delivery-mcp-linux-x86_64.tar.gz
            dist/oci-email-delivery-mcp-linux-x86_64.tar.gz.sha256
            dist/oci-email-delivery-mcp-linux-x86_64.cdx.json

  attest-main-dispatch:
    name: Attest main release artifact
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs: build-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download release artifact
        # actions/download-artifact v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: oci-email-delivery-mcp-linux-x86_64
          path: dist

      - name: Verify downloaded artifact
        shell: bash
        run: |
          set -euo pipefail

          printf '%s\n' \
            oci-email-delivery-mcp-linux-x86_64.cdx.json \
            oci-email-delivery-mcp-linux-x86_64.tar.gz \
            oci-email-delivery-mcp-linux-x86_64.tar.gz.sha256 \
            | sort > expected-artifact-files.txt
          find dist -maxdepth 1 -type f -printf '%f\n' \
            | sort > actual-artifact-files.txt
          diff -u expected-artifact-files.txt actual-artifact-files.txt

          (
            cd dist
            sha256sum --check oci-email-delivery-mcp-linux-x86_64.tar.gz.sha256
          )
          printf '%s\n' \
            oci-email-delivery-mcp-linux-x86_64 \
            | sort > expected-archive-files.txt
          tar -tzf dist/oci-email-delivery-mcp-linux-x86_64.tar.gz \
            | sort > actual-archive-files.txt
          diff -u expected-archive-files.txt actual-archive-files.txt

          mkdir extracted
          tar -xzf dist/oci-email-delivery-mcp-linux-x86_64.tar.gz -C extracted
          sbom_path=dist/oci-email-delivery-mcp-linux-x86_64.cdx.json
          jq -e '
            .bomFormat == "CycloneDX"
            and .specVersion == "1.5"
            and (.components | type == "array" and length > 0)
            and (.dependencies | type == "array" and length > 0)
            and (
              .metadata.component["bom-ref"] as $root
              | ($root | type == "string" and length > 0)
              and any(
                .dependencies[];
                .ref == $root
                and (.dependsOn | type == "array" and length > 0)
              )
            )
          ' "$sbom_path" >/dev/null

      - name: Attest release provenance
        # actions/attest v4.1.1
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763
        with:
          subject-path: dist/oci-email-delivery-mcp-linux-x86_64.tar.gz

      - name: Attest release SBOM
        # actions/attest v4.1.1
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763
        with:
          subject-path: dist/oci-email-delivery-mcp-linux-x86_64.tar.gz
          sbom-path: dist/oci-email-delivery-mcp-linux-x86_64.cdx.json
