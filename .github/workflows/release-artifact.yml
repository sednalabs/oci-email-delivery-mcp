name: Release Artifact

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux ${{ matrix.arch }} release artifact
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Install cargo-cyclonedx
        run: cargo install --locked --version 0.5.9 cargo-cyclonedx

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          binary="oci-email-delivery-mcp-linux-${{ matrix.arch }}"
          cp target/release/oci-email-delivery-mcp "dist/${binary}"
          (
            cd dist
            tar -czf "${binary}.tar.gz" "${binary}"
            sha256sum "${binary}.tar.gz" > "${binary}.tar.gz.sha256"
          )

      - name: Generate Linux dependency SBOM
        shell: bash
        run: |
          set -euo pipefail

          cargo cyclonedx \
            --format json \
            --spec-version 1.5 \
            --describe binaries \
            --no-build-deps \
            --target ${{ matrix.rust_target }}
          mv \
            oci-email-delivery-mcp_bin.cdx.json \
            dist/oci-email-delivery-mcp-linux-${{ matrix.arch }}.cdx.json

      - name: Verify release artifact set
        shell: bash
        run: |
          set -euo pipefail

          binary="oci-email-delivery-mcp-linux-${{ matrix.arch }}"
          (
            cd dist
            sha256sum --check "${binary}.tar.gz.sha256"
          )
          printf '%s\n' "${binary}" | sort > expected-archive-files.txt
          tar -tzf "dist/${binary}.tar.gz" \
            | sort > actual-archive-files.txt
          diff -u expected-archive-files.txt actual-archive-files.txt

          sbom_path="dist/${binary}.cdx.json"
          jq -e '
            .bomFormat == "CycloneDX"
            and .specVersion == "1.5"
            and (.components | type == "array" and length > 0)
            and (.dependencies | type == "array" and length > 0)
            and (
              .metadata.component["bom-ref"] as $root
              | ($root | type == "string" and length > 0)
              and any(
                .dependencies[];
                .ref == $root
                and (.dependsOn | type == "array" and length > 0)
              )
            )
          ' "$sbom_path" >/dev/null
          jq -r '
            .metadata.component["bom-ref"] as $root
            | "SBOM components=\(.components | length) "
              + "dependencies=\(.dependencies | length) "
              + "root_dependencies=\(
                  [.dependencies[] | select(.ref == $root) | .dependsOn[]]
                  | length
                )"
          ' "$sbom_path"

      - name: Upload release artifact
        # actions/upload-artifact v4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: oci-email-delivery-mcp-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/oci-email-delivery-mcp-linux-${{ matrix.arch }}.tar.gz
            dist/oci-email-delivery-mcp-linux-${{ matrix.arch }}.tar.gz.sha256
            dist/oci-email-delivery-mcp-linux-${{ matrix.arch }}.cdx.json

  attest-main-dispatch:
    name: Attest main ${{ matrix.arch }} release artifact
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download release artifact
        # actions/download-artifact v4.3.0
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: oci-email-delivery-mcp-linux-${{ matrix.arch }}
          path: dist

      - name: Verify downloaded artifact
        shell: bash
        run: |
          set -euo pipefail

          binary="oci-email-delivery-mcp-linux-${{ matrix.arch }}"
          printf '%s\n' \
            "${binary}.cdx.json" \
            "${binary}.tar.gz" \
            "${binary}.tar.gz.sha256" \
            | sort > expected-artifact-files.txt
          find dist -maxdepth 1 -type f -printf '%f\n' \
            | sort > actual-artifact-files.txt
          diff -u expected-artifact-files.txt actual-artifact-files.txt

          (
            cd dist
            sha256sum --check "${binary}.tar.gz.sha256"
          )
          printf '%s\n' "${binary}" | sort > expected-archive-files.txt
          tar -tzf "dist/${binary}.tar.gz" \
            | sort > actual-archive-files.txt
          diff -u expected-archive-files.txt actual-archive-files.txt

          mkdir extracted
          tar -xzf "dist/${binary}.tar.gz" -C extracted
          sbom_path="dist/${binary}.cdx.json"
          jq -e '
            .bomFormat == "CycloneDX"
            and .specVersion == "1.5"
            and (.components | type == "array" and length > 0)
            and (.dependencies | type == "array" and length > 0)
            and (
              .metadata.component["bom-ref"] as $root
              | ($root | type == "string" and length > 0)
              and any(
                .dependencies[];
                .ref == $root
                and (.dependsOn | type == "array" and length > 0)
              )
            )
          ' "$sbom_path" >/dev/null

      - name: Attest release provenance
        # actions/attest v4.1.1
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/oci-email-delivery-mcp-linux-${{ matrix.arch }}.tar.gz

      - name: Attest release SBOM
        # actions/attest v4.1.1
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/oci-email-delivery-mcp-linux-${{ matrix.arch }}.tar.gz
          sbom-path: dist/oci-email-delivery-mcp-linux-${{ matrix.arch }}.cdx.json
