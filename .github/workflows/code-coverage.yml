name: code-coverage

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-coverage::${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-coverage:
    name: Rust Cobertura coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Cache cargo artifacts
        # swatinem/rust-cache v2
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16

      - name: Install coverage tool
        # taiki-e/install-action v2
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p coverage
          cargo llvm-cov --all-targets --all-features \
            --cobertura --output-path coverage/oci-email-delivery-mcp.xml

      - name: Upload Cobertura report
        # actions/upload-artifact v4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-cobertura-coverage
          path: coverage/*.xml
          if-no-files-found: error

  code-quality-upload:
    name: GitHub Code Quality upload
    if: >-
      ${{
        vars.CODE_QUALITY_UPLOAD_ENABLED == 'true' &&
        (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
      }}
    needs: rust-coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    steps:
      - name: Download Cobertura report
        # actions/download-artifact v4.3.0
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rust-cobertura-coverage
          path: coverage

      - name: Upload coverage to GitHub Code Quality
        # actions/upload-code-coverage v1
        uses: actions/upload-code-coverage@d8e329117199404bba6fc81efe8093dc7c015e34
        with:
          file: coverage/oci-email-delivery-mcp.xml
          language: Rust
          label: code-coverage/oci-email-delivery-mcp
